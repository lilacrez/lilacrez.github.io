<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 12 - iOS 14</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap');

    body {
      overflow-x: hidden;
      color: #666;
      margin: 0 auto;
      background: #000;
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }

    p, h1, h2, h3, h4, h5, h6 { margin: 0; }
    a { color: #666; text-decoration: none; }

    .iphoneMock {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90%;
      margin: 0 auto;
      padding: 50px 0;
      overflow: hidden;
    }

    .iphone {
      width: 320px;
      height: 640px;
      border-radius: 45px;
      position: relative;
      user-select: none;
      transition: ease all 1s;
    }

    .iphone.initAnimation {
      transform: translateY(200px);
      opacity: 0;
    }

    .bordeColor {
      display: flex;
      height: 100%;
      width: 100%;
      background-color: #152839;
      border: 1px solid rgba(255,255,255,.6);
      box-shadow: inset 0 0 3px 1px #fff;
      border-radius: 45px;
      position: relative;
    }

    .bordeNegro {
      display: flex;
      width: calc(100% - 14px);
      height: calc(100% - 14px);
      border-radius: 40px;
      background-color: #000;
      position: relative;
      overflow: hidden;
      margin: auto;
    }

    .notch {
      display: flex;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 32px;
      border-bottom-left-radius: 17px;
      border-bottom-right-radius: 17px;
      background-color: #000;
      z-index: 100;
    }

    .notch .camara {
      position: absolute;
      right: 35px;
      top: 9px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #1b1b1b;
    }

    /* KİLİT EKRANI VE DÜZELTİLMİŞ UFAK TUŞLAR */
    .lock-screen-custom {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/wallpaper.jpg?alt=media&token=059229cc-3823-4d27-834a-7b62cabd69d2') center/cover;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 50px 20px 30px;
      color: white;
      transition: transform 0.5s cubic-bezier(.666, 0, .4, 1), opacity 0.4s;
      box-sizing: border-box;
    }

    .lock-screen-custom.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .lock-clock { text-align: center; margin-bottom: 30px; }
    .lock-time { font-size: 4.5em; font-weight: 300; line-height: 1; }
    .lock-date { font-size: 1.1em; margin-top: 5px; font-weight: 500; }

    .passcode-container { text-align: center; width: 100%; margin-top: auto; margin-bottom: 20px; }
    .passcode-text { font-size: 1em; margin-bottom: 15px; }
    .dots { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; background: transparent; transition: 0.2s; }
    .dot.filled { background: white; }

    /* Tuş Takımı Boyutları Küçültüldü ve Sabitlendi */
    .keypad { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
      width: 210px; 
      margin: 0 auto; 
    }
    .key {
      width: 60px; 
      height: 60px; 
      background: rgba(255,255,255,0.2); 
      backdrop-filter: blur(10px);
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      font-size: 1.4em; 
      font-weight: 400; 
      cursor: pointer; 
      transition: background 0.15s;
      margin: 0 auto;
    }
    .key:active { background: rgba(255,255,255,0.5); }

    .mainScreen {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      background: url('https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/wallpaper.jpg?alt=media&token=059229cc-3823-4d27-834a-7b62cabd69d2') center/cover;
    }

    .appScreen {
      position: absolute;
      inset: 0;
      padding-top: 35px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .appScreen.hidden { display: none; }

    .mainApps {
      width: 100%;
      height: 75%;
      overflow: hidden;
      position: relative;
    }

    .wrapperApps {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .grupo {
      min-width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      padding: 10px;
      box-sizing: border-box;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .app .icono {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-color: #fff;
    }

    .app .nombre {
      font-size: 10px;
      color: #fff;
      margin-top: 3px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .deckApps {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(15px);
      margin: 10px 15px;
      padding: 10px;
      border-radius: 25px;
    }

    .wrapperDots {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .dot-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }
    .dot-indicator.activo {
      background: #fff;
    }

    .statusBar {
      display: flex;
      justify-content: space-between;
      padding: 8px 20px 0;
      color: white;
      font-size: 11px;
      position: absolute;
      top: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 50;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <section class="iphoneMock">
    <div class="container">
      <div class="iphone initAnimation">
        <div class="bordeColor">
          <div class="bordeNegro">
            <div class="notch">
              <div class="camara"></div>
            </div>

            <!-- KİLİT EKRANI (Şifre: 7900) -->
            <div class="lock-screen-custom" id="customLockScreen">
              <div class="lock-clock">
                <div class="lock-time" id="customLockTime">05.33</div>
                <div class="lock-date" id="customLockDate">Wed Feb 25</div>
              </div>
              <div class="passcode-container">
                <div class="passcode-text">Enter Passcode</div>
                <div class="dots">
                  <div class="dot" id="dot1"></div>
                  <div class="dot" id="dot2"></div>
                  <div class="dot" id="dot3"></div>
                  <div class="dot" id="dot4"></div>
                </div>
                <div class="keypad">
                  <div class="key" onclick="pressKey('1')">1</div>
                  <div class="key" onclick="pressKey('2')">2</div>
                  <div class="key" onclick="pressKey('3')">3</div>
                  <div class="key" onclick="pressKey('4')">4</div>
                  <div class="key" onclick="pressKey('5')">5</div>
                  <div class="key" onclick="pressKey('6')">6</div>
                  <div class="key" onclick="pressKey('7')">7</div>
                  <div class="key" onclick="pressKey('8')">8</div>
                  <div class="key" onclick="pressKey('9')">9</div>
                  <div class="key" style="visibility: hidden;"></div>
                  <div class="key" onclick="pressKey('0')">0</div>
                  <div class="key" style="font-size: 1em;" onclick="clearPin()">Sil</div>
                </div>
              </div>
            </div>

            <div class="mainScreen">
              <div class="statusBar">
                <div class="leftSide"><span class="operador">KT케이티</span></div>
                <div class="rightSide">LTE</div>
              </div>

              <div class="appScreen hidden">
                <div class="mainApps">
                  <div class="wrapperApps"></div>
                </div>
                <div class="wrapperDots"></div>
                <div class="deckApps">
                  <div class="app"><div class="icono" style="background-image: url(https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fllamadas.png?alt=media&token=24b6d8a0-d111-4e85-bf53-39f23de9145a);"></div></div>
                  <div class="app"><div class="icono" style="background-image: url(https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fsafari.png?alt=media&token=aec77205-ccfe-4b77-ae66-272843db2abe);"></div></div>
                  <div class="app"><div class="icono" style="background-image: url(https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fwhatsapp.png?alt=media&token=b3416a44-56fc-4991-a10b-e4a34944bf3c);"></div></div>
                  <div class="app"><div class="icono" style="background-image: url(https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Ffacebook.png?alt=media&token=f383d17e-32a7-49ef-8ebb-c723d556baa2);"></div></div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // ŞİFRE SİSTEMİ (7900)
    let enteredPin = "";
    const correctPin = "7900";

    function pressKey(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updateDots();
        if (enteredPin.length === 4) {
          setTimeout(checkPin, 200);
        }
      }
    }

    function clearPin() {
      enteredPin = "";
      updateDots();
    }

    function updateDots() {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById("dot" + i);
        if (i <= enteredPin.length) {
          dot.classList.add("filled");
        } else {
          dot.classList.remove("filled");
        }
      }
    }

    function checkPin() {
      if (enteredPin === correctPin) {
        document.getElementById("customLockScreen").classList.add("hidden");
        document.querySelector(".appScreen").classList.remove("hidden");
      } else {
        alert("Incorrect Password");
        clearPin();
      }
    }

    // SAAT VE TARİH
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", hour12: false });
      const dateString = now.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" });
      
      const tElem = document.getElementById("customLockTime");
      const dElem = document.getElementById("customLockDate");
      if(tElem) tElem.innerText = timeString;
      if(dElem) dElem.innerText = dateString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // UYGULAMA LİSTESİ
    $(function(){
      const globalState = {
        apps: [
          { nombre: 'Spotify', icono: 'Spotify.jpg' },
          { nombre: 'Gmail', icono: 'Gmail logo - United States.jpg' },
          { nombre: 'X', icono: 'TWITTER X ICON SQUARE.jpg' },
          { nombre: 'Notes', icono: 'Notes.jpg' },
          { nombre: 'Tiktok', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Ffotos.png?alt=media&token=86d712fd-aab1-48a3-a6d0-f2b5b7f9a2ab' },
          { nombre: 'Camera', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fmaps.png?alt=media&token=309018b2-981a-44fd-bf97-8da765fef711' },
          { nombre: 'Photos', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fcamara.png?alt=media&token=bd81cee7-b011-4773-a053-a7cd935e34c3' },
          { nombre: 'Instagram', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Frecordatorios.png?alt=media&token=2dbccbc3-374b-4eed-aa00-68db99217b7d' },
          { nombre: 'WhatsApp', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Ffacebook.png?alt=media&token=f383d17e-32a7-49ef-8ebb-c723d556baa2' },
          { nombre: 'Notes', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fnotas.png?alt=media&token=7a25ae1c-9010-48e4-81e8-e04a904024e9' },
          { nombre: 'App Store', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fappstore.png?alt=media&token=fe121a13-738f-43cd-936b-45ee7fb90cec' },
          { nombre: 'Salud', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fsalud.png?alt=media&token=fee7445d-600c-4146-a590-1adc1d40001b' },
          { nombre: 'Mensajes', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fmensajes.png?alt=media&token=e389ae38-bbeb-4ca9-aa46-4be8a5b6ca90' },
          { nombre: 'Configuración', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fconfiguracion.png?alt=media&token=dfe6b4dd-0b50-4a78-8ef1-22728ed9840c' },
          { nombre: 'BBVA', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fbbva.png?alt=media&token=840b9fa7-c765-4147-9138-8234eabfeb9e' },
          { nombre: 'WhatsApp', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fwhatsapp.png?alt=media&token=b3416a44-56fc-4991-a10b-e4a34944bf3c' },
          { nombre: 'Calculadora', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fcalculadora.png?alt=media&token=0ce89e65-2e11-408c-8467-39637f0f19f8' },
          { nombre: 'Twitter', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Ftwitter.png?alt=media&token=4360a8ea-afce-4f20-9057-bb2d4d5a9e41' },
          { nombre: 'Spotify', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fspotify.png?alt=media&token=f538e504-a8d7-4707-a308-8d4bc2b6f7f6' },
          { nombre: 'YouTube', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fyoutube.png?alt=media&token=180f2d4c-32bf-4d40-855c-c70148d727e9' }
        ]
      };

      function pintarApps(apps, container, containerDots){
        container.empty();
        containerDots.empty();
        
        let html = '<div class="grupo">';
        apps.map((app) => {
          html += `<div class="app"><div class="icono" style="background-image:url(${app.icono});"></div><p class="nombre">${app.nombre}</p></div>`;
        });
        html += '</div>';
        container.append(html);
        containerDots.append(`<div class="dot-indicator activo"></div>`);
      }

      function renderizarUI(){
        pintarApps(globalState.apps, $('.wrapperApps'), $('.wrapperDots'));
      }

      function encendido(){
        renderizarUI();
        setTimeout(() => {
          $('.iphone').removeClass('initAnimation');
        }, 500);
      }

      encendido();
    });
  </script>
</body>
</html>
