<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 12 - iOS 14</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap');

    body {
      overflow-x: hidden;
      color: #666;
      margin: 0 auto;
      background: #000;
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }

    p, h1, h2, h3, h4, h5, h6 { margin: 0; }
    a { color: #666; text-decoration: none; }

    .iphoneMock {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90%;
      margin: 0 auto;
      padding: 50px 0;
      overflow: hidden;
    }

    .iphone {
      width: 320px;
      height: 640px;
      border-radius: 45px;
      position: relative;
      user-select: none;
      transition: ease all 1s;
    }

    .iphone.initAnimation {
      transform: translateY(200px);
      opacity: 0;
    }

    .bordeColor {
      display: flex;
      height: 100%;
      width: 100%;
      background-color: #152839;
      border: 1px solid rgba(255,255,255,.6);
      box-shadow: inset 0 0 3px 1px #fff;
      border-radius: 45px;
      position: relative;
    }

    .bordeNegro {
      display: flex;
      width: calc(100% - 14px);
      height: calc(100% - 14px);
      border-radius: 40px;
      background-color: #000;
      position: relative;
      overflow: hidden;
      margin: auto;
    }

    .notch {
      display: flex;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 32px;
      border-bottom-left-radius: 17px;
      border-bottom-right-radius: 17px;
      background-color: #000;
      z-index: 100;
    }

    .notch .camara {
      position: absolute;
      right: 35px;
      top: 9px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #1b1b1b;
    }

    /* KİLİT EKRANI VE DÜZELTİLMİŞ UFAK TUŞLAR */
    .lock-screen-custom {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('kilitekran (1).jpg') center/cover;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 50px 20px 30px;
      color: white;
      transition: transform 0.5s cubic-bezier(.666, 0, .4, 1), opacity 0.4s;
      box-sizing: border-box;
    }

    .lock-screen-custom.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .lock-clock { text-align: center; margin-bottom: 30px; }
    .lock-time { font-size: 4.5em; font-weight: 300; line-height: 1; }
    .lock-date { font-size: 1.1em; margin-top: 5px; font-weight: 500; }

    .passcode-container { text-align: center; width: 100%; margin-top: auto; margin-bottom: 20px; }
    .passcode-text { font-size: 1em; margin-bottom: 15px; }
    .dots { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; background: transparent; transition: 0.2s; }
    .dot.filled { background: white; }

    /* Tuş Takımı Boyutları Küçültüldü ve Sabitlendi */
    .keypad { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
      width: 210px; 
      margin: 0 auto; 
    }
    .key {
      width: 60px; 
      height: 60px; 
      background: rgba(255,255,255,0.2); 
      backdrop-filter: blur(10px);
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      font-size: 1.4em; 
      font-weight: 400; 
      cursor: pointer; 
      transition: background 0.15s;
      margin: 0 auto;
    }
    .key:active { background: rgba(255,255,255,0.5); }

    .mainScreen {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      background: url('indir (21).jpg') center/cover;
    }

    .appScreen {
      position: absolute;
      inset: 0;
      padding-top: 35px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .appScreen.hidden { display: none; }

    .mainApps {
      width: 100%;
      height: 75%;
      overflow: hidden;
      position: relative;
    }

    .wrapperApps {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .grupo {
      min-width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      padding: 10px;
      box-sizing: border-box;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .app .icono {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-color: #fff;
    }

    .app .nombre {
      font-size: 10px;
      color: #fff;
      margin-top: 3px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .deckApps {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(15px);
      margin: 10px 15px;
      padding: 10px;
      border-radius: 25px;
    }

    .wrapperDots {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .dot-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }
    .dot-indicator.activo {
      background: #fff;
    }

    .statusBar {
      display: flex;
      justify-content: space-between;
      padding: 8px 20px 0;
      color: white;
      font-size: 11px;
      position: absolute;
      top: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 50;
    }
    /* iOS WHATSAPP ARAYÜZÜ */
    .whatsapp-app {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b141a;
      color: #e9edef;
      z-index: 200;
      display: flex;
      flex-direction: column;
      border-radius: 32px;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .whatsapp-app.open {
      transform: translateY(0);
    }

    .wa-main-header {
      padding: 36px 14px 8px;
      background-color: #0b141a;
    }

    .wa-top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .wa-circle-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #202c33;
      color: #e9edef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    .wa-right-actions { display: flex; gap: 8px; }
    .wa-green-btn { background-color: #00a884; color: #0b141a; font-weight: bold; }

    .wa-big-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .wa-search-bar {
      background-color: #202c33;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8696a0;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .wa-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .wa-filter-pill {
      background-color: #202c33;
      color: #8696a0;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 500;
    }
    .wa-filter-pill.active { background-color: #0a332c; color: #00a884; }

    .wa-archived {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 12.5px;
      color: #8696a0;
      border-bottom: 0.5px solid #1f2c33;
    }

    .wa-archived-left { display: flex; align-items: center; gap: 12px; color: #e9edef; font-weight: 500; }

    .wa-chat-list { flex: 1; overflow-y: auto; }
    .wa-chat-list::-webkit-scrollbar { display: none; }

    .wa-chat-item { display: flex; align-items: center; padding: 9px 14px; cursor: pointer; }
    .wa-chat-item:active { background-color: #182229; }

    .wa-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #2a3942;
      margin-right: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #cfd8dc;
      font-size: 15px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }

    .wa-info { flex: 1; overflow: hidden; border-bottom: 0.5px solid #1f2c33; padding-bottom: 9px; }
    .wa-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .wa-name { font-size: 14px; font-weight: 600; color: #e9edef; }
    .wa-time { font-size: 11px; color: #8696a0; }
    .wa-time.unread { color: #00a884; font-weight: 500; }

    .wa-bottom-row { display: flex; justify-content: space-between; align-items: center; }
    .wa-last-msg { font-size: 12px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 195px; }

    .wa-unread-badge {
      background-color: #00a884;
      color: #0b141a;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .wa-tab-bar {
      background-color: #161f26;
      border-top: 0.5px solid #222d34;
      display: flex;
      justify-content: space-around;
      padding: 6px 0 18px;
      font-size: 9.5px;
      color: #8696a0;
    }
    .wa-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .wa-tab.active { color: #e9edef; font-weight: 600; }
    .wa-tab-icon { font-size: 16px; }

    /* Sohbet İçi Arayüz */
    .wa-chat-view {
      position: absolute;
      inset: 0;
      background-color: #0b141a;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 210;
    }
    .wa-chat-view.active { transform: translateX(0); }

    .wa-chat-header {
      background-color: #161f26;
      padding: 36px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid #222d34;
    }
    .wa-chat-header-left { display: flex; align-items: center; gap: 8px; }
    .wa-back-btn { color: #00a884; font-size: 18px; cursor: pointer; font-weight: bold; padding-right: 4px; }
    .wa-chat-avatar-sm {
      width: 30px; height: 30px; border-radius: 50%; background-color: #2a3942;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff;
      background-size: cover; background-position: center;
    }
    .wa-chat-title-box h3 { font-size: 13.5px; font-weight: 600; color: #fff; }
    .wa-chat-title-box span { font-size: 10px; color: #8696a0; display: block; }
    .wa-chat-icons { display: flex; gap: 12px; color: #00a884; font-size: 14px; }

    .wa-messages {
      flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      background-color: #0b141a; background-image: radial-gradient(#1d282f 1px, transparent 1px); background-size: 16px 16px;
    }
    .wa-messages::-webkit-scrollbar { display: none; }

    .msg { max-width: 78%; padding: 6px 9px 4px; border-radius: 10px; font-size: 12px; line-height: 1.35; position: relative; word-wrap: break-word; }
    .msg.received { background-color: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 2px; }
    .msg.sent { background-color: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 2px; }

    .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 3px; font-size: 9px; color: rgba(255, 255, 255, 0.6); margin-top: 2px; }
    .blue-ticks { color: #53bdeb; font-weight: bold; letter-spacing: -2px; }

    .wa-input-area { background-color: #161f26; padding: 7px 10px 20px; display: flex; gap: 8px; align-items: center; }
    .wa-plus-btn { color: #00a884; font-size: 20px; font-weight: 300; cursor: pointer; }
    .wa-input { flex: 1; background-color: #2a3942; border: none; border-radius: 16px; padding: 6px 12px; color: #fff; font-size: 12px; outline: none; }
    .wa-send-btn { background-color: #00a884; color: #0b141a; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Alt Home Bar Çubuğu */
    .home-bar-container { position: absolute; bottom: 4px; left: 0; width: 100%; height: 14px; display: flex; justify-content: center; align-items: center; z-index: 300; cursor: pointer; }
    .home-bar { width: 110px; height: 4px; background-color: rgba(255, 255, 255, 0.8); border-radius: 10px; }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

  <script>
    // ŞİFRE SİSTEMİ (7900)
    let enteredPin = "";
    const correctPin = "7900";

    function pressKey(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updateDots();
        if (enteredPin.length === 4) {
          setTimeout(checkPin, 200);
        }
      }
    }

    function clearPin() {
      enteredPin = "";
      updateDots();
    }

    function updateDots() {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById("dot" + i);
        if (i <= enteredPin.length) {
          dot.classList.add("filled");
        } else {
          dot.classList.remove("filled");
        }
      }
    }

    function checkPin() {
      if (enteredPin === correctPin) {
        document.getElementById("customLockScreen").classList.add("hidden");
        document.querySelector(".appScreen").classList.remove("hidden");
      } else {
        alert("Incorrect Password");
        clearPin();
      }
    }

    // SAAT VE TARİH
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", hour12: false });
      const dateString = now.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" });
      
      const tElem = document.getElementById("customLockTime");
      const dElem = document.getElementById("customLockDate");
      if(tElem) tElem.innerText = timeString;
      if(dElem) dElem.innerText = dateString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // UYGULAMA LİSTESİ

          { nombre: 'Spotify', icono: 'Spotify.jpg' },
          { nombre: 'Gmail', icono: 'Gmail.jpg' },

          { nombre: 'Notes', icono: 'Notes.jpg' },
          { nombre: 'Instagram', icono: 'insta.jpg' },
          { nombre: 'Calculator', icono: 'hesapmakinesi.jpg' },
          { nombre: 'Maps', icono: 'harita.jpg' },
          { nombre: 'Camera', icono: 'camera.jpg' },
          { nombre: 'TikTok', icono: 'TikTok.jpg' },
          { nombre: 'Letterboxd', icono: 'Letterboxd.jpg' },
          { nombre: 'App Store', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fappstore.png?alt=media&token=fe121a13-738f-43cd-936b-45ee7fb90cec' },
          { nombre: 'Salud', icono: 'https://firebasestorage.googleapis.com/v0/b/fotos-3cba1.appspot.com/o/ios14%2Fsalud.png?alt=media&token=fee7445d-600c-4146-a590-1adc1d40001b' },

        ]
      };

      function pintarApps(apps, container, containerDots){
        container.empty();
        containerDots.empty();
        
        let html = '<div class="grupo">';
        apps.map((app) => {

    let currentChatId = null;

    function renderWaList() {
      const list = document.getElementById("waChatList");
      list.innerHTML = "";
      waChats.forEach(chat => {
        const lastMsg = chat.messages[chat.messages.length - 1];
        const tickHtml = lastMsg.type === "sent" ? '<span class="blue-ticks">✓✓</span> ' : '';
        const badgeHtml = chat.unread > 0 ? `<div class="wa-unread-badge">${chat.unread}</div>` : '';
        const timeClass = chat.unread > 0 ? 'wa-time unread' : 'wa-time';

        const avatarStyle = chat.avatar ? `background-image: url('${chat.avatar}');` : '';
        const avatarText = chat.avatar ? '' : chat.initials;

        list.innerHTML += `
          <div class="wa-chat-item" onclick="openChat(${chat.id})">
            <div class="wa-avatar" style="${avatarStyle}">${avatarText}</div>
            <div class="wa-info">
              <div class="wa-top-row">
                <span class="wa-name">${chat.name}</span>
                <span class="${timeClass}">${chat.time}</span>
              </div>
              <div class="wa-bottom-row">
                <span class="wa-last-msg">${tickHtml}${lastMsg.text}</span>
                ${badgeHtml}
              </div>
            </div>
          </div>
        `;
      });
    }

    window.openWhatsApp = function() {
      renderWaList();
      document.getElementById("whatsappApp").classList.add("open");
    };

    window.openChat = function(id) {
      currentChatId = id;
      const chat = waChats.find(c => c.id === id);
      chat.unread = 0;
      document.getElementById("waActiveChatName").innerText = chat.name;
      document.getElementById("waActiveStatus").innerText = chat.status;

      const activeAvatar = document.getElementById("waActiveAvatar");
      if (chat.avatar) {
        activeAvatar.style.backgroundImage = `url('${chat.avatar}')`;
        activeAvatar.style.backgroundSize = "cover";
        activeAvatar.style.backgroundPosition = "center";
        activeAvatar.innerText = "";
      } else {
        activeAvatar.style.backgroundImage = "none";
        activeAvatar.innerText = chat.initials;
      }

      renderMessages(chat);
      document.getElementById("waChatView").classList.add("active");
    };

    window.closeChat = function() {
      document.getElementById("waChatView").classList.remove("active");
      renderWaList();
    };

    function renderMessages(chat) {
      const msgBox = document.getElementById("waMessages");
      msgBox.innerHTML = "";
      chat.messages.forEach(m => {
        const tickHtml = m.type === "sent" ? '<span class="blue-ticks">✓✓</span>' : '';
        msgBox.innerHTML += `
          <div class="msg ${m.type}">
            <div>${m.text}</div>
            <div class="msg-meta"><span>${m.time}</span>${tickHtml}</div>
          </div>
        `;
      });
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    window.sendWaMessage = function() {
      const input = document.getElementById("waInput");
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });

      const chat = waChats.find(c => c.id === currentChatId);
      chat.messages.push({ type: "sent", text: text, time: timeStr });
      chat.time = timeStr;
      input.value = "";
      renderMessages(chat);
    };

    window.handleWaEnter = function(e) {
      if (e.key === "Enter") sendWaMessage();
    };

    window.closeAllApps = function() {
      document.getElementById("whatsappApp").classList.remove("open");
      document.getElementById("waChatView").classList.remove("active");
    };
